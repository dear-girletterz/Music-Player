<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanyfa's Music Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #e3f2fd 0%, #f8fafc 100%); background-attachment: fixed; color: #4a5568; padding: 20px; display: flex; justify-content: center; min-height: 100vh; transition: background 0.5s ease; }
        .container { width: 100%; max-width: 400px; margin-bottom: 180px; }
        .hide { display: none !important; }
        .playlist-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.02); }
        .playlist-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .back-btn { cursor: pointer; font-size: 28px; color: #4a5568; text-decoration: none; }
        .song-list { display: flex; flex-direction: column; gap: 10px; }
        .song-item { display: flex; align-items: center; gap: 15px; padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.6); cursor: pointer; transition: background 0.2s; }
        .active-song { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(74, 85, 104, 0.15); }
        .song-num { font-size: 14px; color: #a0aec0; min-width: 20px; }
        .song-meta { flex-grow: 1; display: flex; flex-direction: column; }
        .s-title { font-size: 14px; font-weight: 600; color: #4a5568; }
        .s-artist { font-size: 12px; color: #a0aec0; }
        .play-icon-list { color: #a0aec0; }
        .empty-msg { text-align: center; color: #a0aec0; padding: 20px; }
        
        /* MINI PLAYER */
        .mini-player { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: calc(100% - 30px); max-width: 360px; border-radius: 28px; padding: 24px 20px 20px 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05); z-index: 999; border: 1px solid rgba(255, 255, 255, 0.8); transition: background 0.3s ease; }
        .mini-song-info { text-align: center; width: 100%; }
        #mini-title { font-size: 18px; font-weight: 700; color: #2c3e50; letter-spacing: -0.3px; line-height: 1.3; }
        #mini-artist { font-size: 12px; color: #718096; text-transform: uppercase; font-weight: 600; margin-top: 4px; }
        .progress-wrapper { display: flex; align-items: center; justify-content: center; width: 100%; gap: 12px; margin-top: 4px; }
        #progress-bar { flex-grow: 1; height: 4px; accent-color: #718096; background: rgba(0, 0, 0, 0.05); cursor: pointer; outline: none; }
        .mini-bottom-section { display: flex; flex-direction: column; align-items: center; width: 100%; gap: 12px; }
        #current-time, #total-duration { font-size: 14px; color: #718096; font-weight: 600; }
        .mini-controls-row { display: flex; align-items: center; justify-content: center; gap: 45px; width: 100%; }
        .mini-controls-row button { background: none; border: none; color: #a0aec0; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease; }
        .mini-controls-row button:active { transform: scale(0.9); color: #4a5568; }
        .mini-controls-row .material-icons-round { font-size: 34px; }
        .mini-controls-row button.play-trigger { color: #4a5568; }
        .mini-controls-row button.play-trigger .material-icons-round { font-size: 44px; }
    </style>
</head>
<body>

    <div class="container" id="playlist-screen">
        <div class="playlist-card">
            <div class="playlist-header">
                <a href="index.html" class="material-icons-round back-btn">arrow_back</a>
                <h3 id="playlist-title">Nama Playlist</h3>
            </div>
            <div class="song-list" id="song-list-container"></div>
        </div>
    </div>

    <div class="mini-player hide" id="mini-player">
        <div class="mini-song-info">
            <h4 id="mini-title">Judul Lagu</h4>
            <p id="mini-artist">Penyanyi</p>
        </div>
        <div class="progress-wrapper">
            <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" onchange="seekAudio()">
            <span id="total-duration">0:00</span>
        </div>
        <div class="mini-bottom-section">
            <span id="current-time">0:00</span>
            <div class="mini-controls-row">
                <button onclick="prevSong()"><span class="material-icons-round">skip_previous</span></button>
                <button onclick="togglePlay()" class="play-trigger"><span class="material-icons-round" id="mini-play-icon">play_arrow</span></button>
                <button onclick="nextSong()"><span class="material-icons-round">skip_next</span></button>
            </div>
        </div>
    </div>

                { title: "Dreamer", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/dreamer.mp3?v=2" },
                { title: "Deep Down", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/deepdown.mp3?v=2" },
                { title: "Happily Ever After", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/happilyeverafter.mp3?v=2" },
                { title: "Skipping Stones", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/skippingstones.mp3?v=2" },
                { title: "Blue Spring", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/bluespring.mp3?v=2" },
                { title: "Do It Like That", artist: "TXT (ft. Jonas Brothers)", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/doitlikethat.mp3?v=2" },
                { title: "I'll See You There Tomorrow", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/illseeyoutheretomorrow.mp3?v=2" },
                { title: "Deja Vu", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/dejavu.mp3?v=2" },
                { title: "Miracle", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/miracle.mp3?v=2" },
                { title: "The Killa (I Belong You)", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/thekilla.mp3?v=2" },
                { title: "Quarter Life", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/quarterlife.mp3?v=2" },
                { title: "Heaven", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/heaven.mp3?v=2" },
                { title: "Over The Moon", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/overthemoon.mp3?v=2" },
                { title: "Danger", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/danger.mp3?v=2" },
                { title: "Resist (Not Gonna Run Away)", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/resist.mp3?v=2" },
                { title: "Forty One Winks", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/fortyonewinks.mp3?v=2" },
                { title: "Higher Than Heaven", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/higherthanheaven.mp3?v=2" },

                { title: "Beautiful Strangers", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/beautifulstrangers.mp3?v=2" },
                { title: "Ghost Girl", artist: "YEONJUN", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/ghostgirl.mp3?v=2" },
                { title: "Sunday Driver", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/sundaydriver.mp3?v=2" },
                { title: "Dance With You", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/dancewithyou.mp3?v=2" },
                { title: "Take My Half", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/takemyhalf.mp3?v=2" },
                { title: "Bird Of Night", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/birdofnight.mp3?v=2" },
                { title: "Song Of The Stars", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/songofthestars.mp3?v=2" },
                { title: "Bed Of Thorns", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/bedofthorns.mp3?v=2" },
                { title: "Stick With You", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/stickwithyou.mp3?v=2" },
                { title: "Take Me To Nirvana", artist: "TXT (ft. Vinida Weng)", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/takemetonirvana.mp3?v=2" },
                { title: "So What", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/sowhat.mp3?v=2" },
                { title: "21st Century Romance", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/twentyfirstcenturyromance.mp3?v=2" },
                { title: "Dream Of Mine", artist: "TXT", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/dreamofmine.mp3?v=2" },
                { title: "SSS (Sending Secret Signals)", artist: "TXT (ft. Hyde)", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu7/sss.mp3?v=2" }, 
            ],
            
            nct1: [], nct2: [],
            treasure1: [], treasure2: [],
            blackpink1: [], blackpink2: [],
            bts1: [], bts2: [],
            lainnya: []
        };

        let currentPlaylist = [];
        let currentPlaylistName = "";
        let currentIndex = 0;
        const audio = document.getElementById('audio-player');
        let isPlaying = false;

        const urlParams = new URLSearchParams(window.location.search);
        const grupAktif = urlParams.get('grup') || 'lainnya';

        function initPlaylist() {
            currentPlaylistName = grupAktif.toLowerCase();
            currentPlaylist = allPlaylists[currentPlaylistName] || [];
            
            let displayTitle = currentPlaylistName.toUpperCase();
            const formatGrup = ['enhypen', 'cortis', 'lngshot', 'hearts2hearts', 'babymonster', 'illit', 'aespa', 'txt', 'nct', 'treasure', 'blackpink', 'bts'];
            formatGrup.forEach(grup => {
                if (currentPlaylistName === grup + '1') displayTitle = (grup === 'hearts2hearts' ? 'H2H' : grup.toUpperCase()) + " 1";
                if (currentPlaylistName === grup + '2') displayTitle = (grup === 'hearts2hearts' ? 'H2H' : grup.toUpperCase()) + " 2";
            });
            document.getElementById('playlist-title').innerText = displayTitle;
            
            renderSongList();
            setDynamicBackground(currentPlaylistName);
        }

        function setDynamicBackground(folderLower) {
            if (['enhypen1', 'enhypen2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #e0f2fe 0%, #f8fafc 100%)"; // Biru
            } else if (['cortis1', 'cortis2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #dcfce7 0%, #f8fafc 100%)"; // Hijau
            } else if (['lngshot1', 'lngshot2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #f3f4f6 0%, #f8fafc 100%)"; // Abu-abu
            } else if (['hearts2hearts1', 'hearts2hearts2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #fff6f0 0%, #f8fafc 100%)"; // Peach
            } else if (['babymonster1', 'babymonster2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #fce7f3 0%, #f8fafc 100%)"; // Pink
            } else if (['illit1', 'illit2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #fecaca 0%, #f8fafc 100%)"; // Merah
            } else if (['aespa1', 'aespa2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #f3e8ff 0%, #f8fafc 100%)"; // Ungu (BTS sebelumnya)
            } else if (['txt1', 'txt2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #fffdf0 0%, #f8fafc 100%)"; // Kuning Muda sekali
            } else if (['nct1', 'nct2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #fff7ed 0%, #f8fafc 100%)"; // Oranye
            } else if (['treasure1', 'treasure2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #f7f3f0 0%, #f8fafc 100%)"; // Milo muda soft
            } else if (['blackpink1', 'blackpink2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #fdf2f2 0%, #f8fafc 100%)"; // Maroon sangat soft mendekati pink/merah
            } else if (['bts1', 'bts2'].includes(folderLower)) {
                document.body.style.background = "linear-gradient(135deg, #ebebeb 0%, #f8fafc 100%)"; // Abu agak tua sedikit kalem
            } else {
                document.body.style.background = "linear-gradient(135deg, #ffffff 0%, #f8fafc 100%)"; // Putih
            }
        }

        function renderSongList() {
            const listContainer = document.getElementById('song-list-container');
            listContainer.innerHTML = ""; 

            if (currentPlaylist.length === 0) {
                listContainer.innerHTML = `<p class="empty-msg">Belum ada lagu di folder ini ✨</p>`;
                return;
            }

            currentPlaylist.forEach((song, index) => {
                const songItem = document.createElement('div');
                songItem.className = `song-item ${currentIndex === index && isPlaying ? 'active-song' : ''}`;
                songItem.onclick = () => selectSong(index);
                songItem.innerHTML = `
                    <div class="song-num">${index + 1}</div>
                    <div class="song-meta">
                        <span class="s-title">${song.title}</span>
                        <span class="s-artist">${song.artist || 'Unknown'}</span>
                    </div>
                    <span class="material-icons-round play-icon-list">play_circle_filled</span>
                `;
                listContainer.appendChild(songItem);
            });
        }

        function selectSong(index) {
            currentIndex = index;
            const song = currentPlaylist[currentIndex];
            audio.src = song.url;
            audio.load(); 
            audio.play().then(() => {
                isPlaying = true;
                updateUI();
                setupNotification(song);
            }).catch(err => console.log("Gagal memutar:", err));
        }

        function togglePlay() {
            if (!audio.src) return;
            if (isPlaying) { audio.pause(); isPlaying = false; }
            else { audio.play(); isPlaying = true; }
            updateUI();
        }

        function nextSong() {
            if (currentPlaylist.length === 0) return;
            
            if (currentIndex === currentPlaylist.length - 1) {
                const mapGrupLanjutan = {
                    'enhypen1': 'enhypen2',
                    'cortis1': 'cortis2',
                    'lngshot1': 'lngshot2',
                    'hearts2hearts1': 'hearts2hearts2',
                    'babymonster1': 'babymonster2',
                    'illit1': 'illit2',
                    'aespa1': 'aespa2',
                    'txt1': 'txt2',
                    'nct1': 'nct2',
                    'treasure1': 'treasure2',
                    'blackpink1': 'blackpink2',
                    'bts1': 'bts2'
                };

                if (mapGrupLanjutan[currentPlaylistName]) {
                    const nextGrup = mapGrupLanjutan[currentPlaylistName];
                    const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + '?grup=' + nextGrup;
                    window.history.pushState({ path: newUrl }, '', newUrl);
                    
                    currentPlaylistName = nextGrup;
                    currentPlaylist = allPlaylists[nextGrup] || [];
                    
                    initPlaylist();
                    selectSong(0);
                    return; 
                }
            }

            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            selectSong(currentIndex);
        }
                
        function prevSong() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            selectSong(currentIndex);
        }

        function updateUI() {
            const song = currentPlaylist[currentIndex];
            if (!song) return;

            const miniPlayer = document.getElementById('mini-player');
            if (miniPlayer) {
                miniPlayer.classList.remove('hide');
                document.getElementById('mini-title').innerText = song.title;
                document.getElementById('mini-artist').innerText = song.artist;
                document.getElementById('mini-play-icon').innerText = isPlaying ? "pause" : "play_arrow";

                miniPlayer.className = "mini-player"; 
                if (['enhypen1', 'enhypen2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #f0f7ff, #e1effe)";
                else if (['cortis1', 'cortis2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #f3faf4, #e3f7e6)";
                else if (['lngshot1', 'lngshot2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #f3f4f6, #e5e7eb)";
                else if (['hearts2hearts1', 'hearts2hearts2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #fff6f0, #fdede2)";
                else if (['babymonster1', 'babymonster2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #fff5f7, #fde8ec)";
                else if (['illit1', 'illit2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #fff5f5, #fde8e8)";
                else if (['aespa1', 'aespa2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #faf5ff, #f3e8ff)";
                else if (['txt1', 'txt2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #fffef2, #fefce8)";
                else if (['nct1', 'nct2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #fff7ed, #ffedd5)";
                else if (['treasure1', 'treasure2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #f7f3f0, #eee7e0)";
                else if (['blackpink1', 'blackpink2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #fdf2f2, #fceaea)";
                else if (['bts1', 'bts2'].includes(currentPlaylistName)) miniPlayer.style.background = "linear-gradient(135deg, #ebebeb, #e0e0e0)";
                else miniPlayer.style.background = "linear-gradient(135deg, #fafafa, #f1f1f1)"; 
            }

            const items = document.querySelectorAll('.song-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex && isPlaying) item.classList.add('active-song');
                else item.classList.remove('active-song');
            });
        }

        function setupNotification(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title, artist: song.artist, album: currentPlaylistName.toUpperCase()
                });
                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
            }
        }

        audio.onended = () => { nextSong(); };
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                currentTimeEl.innerText = formatTime(audio.currentTime);
            }
        };

        audio.onloadedmetadata = () => {
            totalDurationEl.innerText = formatTime(audio.duration);
        };

        function seekAudio() {
            if (audio.duration) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        }

        initPlaylist();
    </script>
</body>
</html>
