<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves & Night Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HALAMAN 1: DAFTAR FOLDER UTAMA -->
    <div class="container" id="folder-screen">
        <h2 class="app-title">My Vibe Library</h2>
        <div class="folder-list">
            <div class="folder-box f-blue" onclick="openPlaylist('enhypen')">
                <img src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=150&auto=format&fit=crop" class="folder-img" alt="ENHYPEN">
                <span class="folder-name">ENHYPEN</span>
            </div>
            <div class="folder-box f-pink" onclick="openPlaylist('hearts2hearts')">
                <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=150&auto=format&fit=crop" class="folder-img" alt="HEARTS2HEARTS">
                <span class="folder-name">HEARTS2HEARTS</span>
            </div>
            <div class="folder-box f-green" onclick="openPlaylist('cortis')">
                <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=150&auto=format&fit=crop" class="folder-img" alt="CORTIS">
                <span class="folder-name">CORTIS</span>
            </div>
            <div class="folder-box f-red" onclick="openPlaylist('babymonster')">
                <img src="https://images.unsplash.com/photo-1501386761578-eac5c94b800a?q=80&w=150&auto=format&fit=crop" class="folder-img" alt="BABYMONSTER">
                <span class="folder-name">BABYMONSTER</span>
            </div>
            <div class="folder-box f-grey" onclick="openPlaylist('lngshot')">
                <img src="https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?q=80&w=150&auto=format&fit=crop" class="folder-img" alt="LNGSHOT">
                <span class="folder-name">LNGSHOT</span>
            </div>
            <div class="folder-box f-purple" onclick="openPlaylist('lainnya')">
                <img src="https://images.unsplash.com/photo-1459749411175-04bf5292ceea?q=80&w=150&auto=format&fit=crop" class="folder-img" alt="LAINNYA">
                <span class="folder-name">LAINNYA</span>
            </div>
        </div>
    </div>

    <!-- HALAMAN 2: DAFTAR LAGU BERJEJER (PLAYLIST VIEW) -->
    <div class="container hide" id="playlist-screen">
        <div class="playlist-card">
            <div class="playlist-header">
                <span class="material-icons-round back-btn" onclick="backToFolders()">arrow_back</span>
                <h3 id="playlist-title">Nama Playlist</h3>
            </div>
            <!-- Tempat daftar lagu berjejer ke bawah muncul -->
            <div class="song-list" id="song-list-container"></div>
        </div>
    </div>

    <!-- MINI PLAYER YANG MUNCUL DI BAWAH KALO LAGU DIPUTAR -->
    <div class="mini-player hide" id="mini-player" onclick="openFullPlayer()">
        <div class="mini-info">
            <h4 id="mini-title">Judul Lagu</h4>
            <p id="mini-artist">Penyanyi</p>
        </div>
        <div class="mini-controls" onclick="event.stopPropagation();">
            <button onclick="togglePlay()"><span class="material-icons-round" id="mini-play-icon">play_arrow</span></button>
            <button onclick="nextSong()"><span class="material-icons-round">skip_next</span></button>
        </div>
    </div>

    <!-- Tag Audio HTML5 Tersembunyi (Biar bisa jalan di background) -->
    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        // DATABASE LAGU MENGGUNAKAN AUDIO MP3/M4A (BIAR BISA BACKROUND PLAY)
        const allPlaylists = {
            enhypen: [
                { title: "Given-Taken", artist: "ENHYPEN", url: "ENHYPEN - Given-Taken.mp3", cover: "https://i.imgur.com/esqG32w.jpeg" },
                { title: "Let Me In (20 CUBE)", artist: "ENHYPEN", url: "ENHYPEN - Let Me In (20 Cube).mp3", cover: "https://i.imgur.com/esqG32w.jpeg"},
                { title: "10 Months", artist: "ENHYPEN", url: "ENHYPEN - 10 Months.mp3", cover: "https://i.imgur.com/esqG32w.jpeg" },
                { title: "Flicker", artist: "ENHYPEN", url: "ENHYPEN - Flicker.mp3", cover: "https://i.imgur.com/esqG32w.jpeg" }     
            ],
            hearts2hearts: [],
            cortis: [],
            babymonster: [],
            lngshot: [],
            lainnya: []
        };

        let currentPlaylist = [];
        let currentPlaylistName = "";
        let currentIndex = 0;
        const audio = document.getElementById('audio-player');
        let isPlaying = false;

        // Buka daftar lagu berjejer ke bawah
        function openPlaylist(folderName) {
            currentPlaylistName = folderName;
            currentPlaylist = allPlaylists[folderName];
            
            document.getElementById('playlist-title').innerText = folderName.toUpperCase();
            const listContainer = document.getElementById('song-list-container');
            listContainer.innerHTML = ""; // reset list

            if (currentPlaylist.length === 0) {
                listContainer.innerHTML = `<p class="empty-msg">Belum ada lagu di folder ini ✨</p>`;
            } else {
                // Tampilkan list berjejer ke bawah
                currentPlaylist.forEach((song, index) => {
                    const songItem = document.createElement('div');
                    songItem.className = `song-item ${currentIndex === index && currentPlaylistName === folderName && isPlaying ? 'active-song' : ''}`;
                    songItem.onclick = () => selectSong(index);
                    songItem.innerHTML = `
                        <div class="song-num">${index + 1}</div>
                        <div class="song-meta">
                            <span class="s-title">${song.title}</span>
                            <span class="s-artist">${song.artist}</span>
                        </div>
                        <span class="material-icons-round play-icon-list">play_circle_filled</span>
                    `;
                    listContainer.appendChild(songItem);
                });
            }

            document.getElementById('folder-screen').classList.add('hide');
            document.getElementById('playlist-screen').classList.remove('hide');
        }

        function backToFolders() {
            document.getElementById('playlist-screen').classList.add('hide');
            document.getElementById('folder-screen').classList.remove('hide');
        }

        // Ketika salah satu lagu di list diklik
        function selectSong(index) {
            currentIndex = index;
            const song = currentPlaylist[currentIndex];
            
            audio.src = song.url;
            audio.play().then(() => {
                isPlaying = true;
                updateUI();
                setupNotification(song); // Pasang ke bar notifikasi HP
            }).catch(err => console.log("Gagal memutar, cek link audio kamu:", err));
        }

        function togglePlay() {
            if (!audio.src) return;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
            }
            updateUI();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
            }
        }

        function nextSong() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            selectSong(currentIndex);
        }

        function updateUI() {
            const song = currentPlaylist[currentIndex];
            if (!song) return;

            // Munculkan mini player bawah
            document.getElementById('mini-player').classList.remove('hide');
            document.getElementById('mini-title').innerText = song.title;
            document.getElementById('mini-artist').innerText = song.artist;
            
            document.getElementById('mini-play-icon').innerText = isPlaying ? "pause" : "play_arrow";

            // Update status keaktifan di list lagu
            const items = document.querySelectorAll('.song-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex) item.classList.add('active-song');
                else item.classList.remove('active-song');
            });
        }

        // FITUR SAKTI: BIAR NYANTOL DI NOTIFIKASI HP & TETEP NYALA DI BACKGROUND
        function setupNotification(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: currentPlaylistName.toUpperCase(),
                    artwork: [
                        { src: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=256&auto=format&fit=crop', sizes: '256x256', type: 'image/jpeg' }
                    ]
                });

                // Tombol kontrol di Notif HP
                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
            }
        }

        // Otomatis putar lagu berikutnya kalau lagu habis
        audio.onended = () => {
            nextSong();
        };
    </script>
</body>
</html>
