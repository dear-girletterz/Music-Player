<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waves & Night Music</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="folder-screen">
        <h2 class="app-title">My Vibe Library</h2>
        <div class="folder-list">
            <div class="folder-box f-blue" onclick="openPlaylist('enhypen')">
                <img src="https://e.usen.com/image/02583c0ec7a9b0000a1b02f9b4c81d74f958f1f2.jpg" class="folder-img" alt="ENHYPEN">
                <span class="folder-name">ENHYPEN</span>
            </div>
            <div class="folder-box f-pink" onclick="openPlaylist('hearts2hearts')">
                <img src="https://static.wikia.nocookie.net/kpop/images/e/e2/Hearts2Hearts_Rude%21_group_concept_photo_1.png" class="folder-img" alt="HEARTS2HEARTS">
                <span class="folder-name">HEARTS2HEARTS</span>
            </div>
            <div class="folder-box f-green" onclick="openPlaylist('cortis')">
                <img src="https://lxpr.lspr.ac.id/wp-content/uploads/2025/11/X-cortis.jpg" class="folder-img" alt="CORTIS">
                <span class="folder-name">CORTIS</span>
            </div>
            <div class="folder-box f-red" onclick="openPlaylist('babymonster')">
                <img src="https://uploaded.celebconfirmed.com/2_d73841a135.jpg" class="folder-img" alt="BABYMONSTER">
                <span class="folder-name">BABYMONSTER</span>
            </div>
            <div class="folder-box f-grey" onclick="openPlaylist('lngshot')">
                <img src="https://www.billboard.com/wp-content/uploads/2026/02/LNGSHOT-k-pop-rookie-of-the-month-2026-cr-jang-jungwoo-billboard-2.jpg?w=1280" class="folder-img" alt="LNGSHOT">
                <span class="folder-name">LNGSHOT</span>
            </div>
            <div class="folder-box f-purple" onclick="openPlaylist('lainnya')">
                <img src="https://images.stockcake.com/public/e/c/5/ec5d6681-20bf-48fa-a2f3-1f611e01b1f1_large/tropical-sunset-beach-stockcake.jpg" class="folder-img" alt="LAINNYA">
                <span class="folder-name">LAINNYA</span>
            </div>
        </div>
    </div>

    <div class="container hide" id="playlist-screen">
        <div class="playlist-card">
            <div class="playlist-header">
                <span class="material-icons-round back-btn" onclick="backToFolders()">arrow_back</span>
                <h3 id="playlist-title">Nama Playlist</h3>
            </div>
            <div class="song-list" id="song-list-container"></div>
        </div>
    </div>

    <div class="mini-player hide" id="mini-player">
        <div class="mini-song-info">
            <h4 id="mini-title">Judul Lagu</h4>
            <p id="mini-artist">Penyanyi</p>
        </div>

        <div class="progress-wrapper">
            <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" onchange="seekAudio()">
            <span id="total-duration">0:00</span>
        </div>

        <div class="mini-bottom-section">
            <span id="current-time">0:00</span>
            <div class="mini-controls-row">
                <button onclick="prevSong()"><span class="material-icons-round">skip_previous</span></button>
                <button onclick="togglePlay()" class="play-trigger"><span class="material-icons-round" id="mini-play-icon">play_arrow</span></button>
                <button onclick="nextSong()"><span class="material-icons-round">skip_next</span></button>
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const allPlaylists = {
            enhypen: [
                { title: "Given-Taken", artist: "ENHYPEN", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu/giventaken.mp3", cover: "https://i.imgur.com/esqG32w.jpeg" },
                { title: "Let Me In (20 CUBE)", artist: "ENHYPEN", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu/letmein(20cube).mp3", cover: "https://i.imgur.com/esqG32w.jpeg" },
                { title: "10 Months", artist: "ENHYPEN", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu/10months.mp3", cover: "https://i.imgur.com/esqG32w.jpeg" },
                { title: "Flicker", artist: "ENHYPEN", url: "https://cdn.jsdelivr.net/gh/dear-girletterz/Music-Player@main/Lagu/flicker.mp3", cover: "https://i.imgur.com/esqG32w.jpeg" }     
            ],
            hearts2hearts: [],
            cortis: [],
            babymonster: [],
            lngshot: [],
            lainnya: []
        };

        let currentPlaylist = [];
        let currentPlaylistName = "";
        let currentIndex = 0;
        const audio = document.getElementById('audio-player');
        let isPlaying = false;

        function openPlaylist(folderName) {
            currentPlaylistName = folderName;
            currentPlaylist = allPlaylists[folderName];
            
            document.getElementById('playlist-title').innerText = folderName.toUpperCase();
            const listContainer = document.getElementById('song-list-container');
            listContainer.innerHTML = ""; 

            if (currentPlaylist.length === 0) {
                listContainer.innerHTML = `<p class="empty-msg">Belum ada lagu di folder ini ✨</p>`;
            } else {
                currentPlaylist.forEach((song, index) => {
                    const songItem = document.createElement('div');
                    songItem.className = `song-item ${currentIndex === index && currentPlaylistName === folderName && isPlaying ? 'active-song' : ''}`;
                    songItem.onclick = () => selectSong(index);
                    songItem.innerHTML = `
                        <div class="song-num">${index + 1}</div>
                        <div class="song-meta">
                            <span class="s-title">${song.title}</span>
                            <span class="s-artist">${song.artist}</span>
                        </div>
                        <span class="material-icons-round play-icon-list">play_circle_filled</span>
                    `;
                    listContainer.appendChild(songItem);
                });
            }

            document.getElementById('folder-screen').classList.add('hide');
            document.getElementById('playlist-screen').classList.remove('hide');
        }

        function backToFolders() {
            document.getElementById('playlist-screen').classList.add('hide');
            document.getElementById('folder-screen').classList.remove('hide');
        }

        function updatePlaybackPosition() {
            if ('mediaSession' in navigator && audio.duration) {
                navigator.mediaSession.setPositionState({
                    duration: audio.duration,
                    playbackRate: audio.playbackRate,
                    position: audio.currentTime
                });
            }
        }

        function selectSong(index) {
            currentIndex = index;
            const song = currentPlaylist[currentIndex];
            
            audio.src = song.url;
            audio.load(); 
            
            audio.play().then(() => {
                isPlaying = true;
                updateUI();
                setupNotification(song);
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.playbackState = "playing";
                }
            }).catch(err => {
                console.log("Gagal memutar:", err);
            });
        }

        function togglePlay() {
            if (!audio.src) return;
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
            } else {
                audio.play();
                isPlaying = true;
            }
            updateUI();
            if ('mediaSession' in navigator) {
                navigator.mediaSession.playbackState = isPlaying ? "playing" : "paused";
            }
        }

        function nextSong() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex + 1) % currentPlaylist.length;
            selectSong(currentIndex);
        }
                
        function prevSong() {
            if (currentPlaylist.length === 0) return;
            currentIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            selectSong(currentIndex);
        }

        function updateUI() {
            const song = currentPlaylist[currentIndex];
            if (!song) return;

            const miniPlayer = document.getElementById('mini-player');
            miniPlayer.classList.remove('hide');
            document.getElementById('mini-title').innerText = song.title;
            document.getElementById('mini-artist').innerText = song.artist;
            
            document.getElementById('mini-play-icon').innerText = isPlaying ? "pause" : "play_arrow";

            // SINKRONISASI MATRIKS WARNA PASTEL SISI PLAYER
            miniPlayer.className = "mini-player"; 
            if (currentPlaylistName === 'enhypen') miniPlayer.style.background = "linear-gradient(135deg, #e0f2fe, #bae6fd)"; 
            else if (currentPlaylistName === 'hearts2hearts') miniPlayer.style.background = "linear-gradient(135deg, #fce7f3, #fbcfe8)"; 
            else if (currentPlaylistName === 'babymonster') miniPlayer.style.background = "linear-gradient(135deg, #fee2e2, #fecaca)"; 
            else if (currentPlaylistName === 'lngshot') miniPlayer.style.background = "linear-gradient(135deg, #f3f4f6, #e5e7eb)"; 
            else if (currentPlaylistName === 'cortis') miniPlayer.style.background = "linear-gradient(135deg, #f0fdf4, #dcfce7)"; 
            else if (currentPlaylistName === 'lainnya') miniPlayer.style.background = "linear-gradient(135deg, #f3e8ff, #e9d5ff)"; 

            const items = document.querySelectorAll('.song-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex) item.classList.add('active-song');
                else item.classList.remove('active-song');
            });
        }

        function setupNotification(song) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: song.title,
                    artist: song.artist,
                    album: currentPlaylistName.toUpperCase(),
                    artwork: [
                        { src: song.cover, sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => togglePlay());
                navigator.mediaSession.setActionHandler('pause', () => togglePlay());
                navigator.mediaSession.setActionHandler('nexttrack', () => nextSong());
                navigator.mediaSession.setActionHandler('previoustrack', () => prevSong());
                
                navigator.mediaSession.setActionHandler('seekto', (details) => {
                    if (details.fastSeek && 'fastSeek' in audio) {
                        audio.fastSeek(details.seekTime);
                    } else {
                        audio.currentTime = details.seekTime;
                    }
                    updatePlaybackPosition();
                });
            }
        }

        audio.onended = () => { nextSong(); };
        
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        audio.ontimeupdate = () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeEl.innerText = formatTime(audio.currentTime);
                updatePlaybackPosition();
            }
        };

        audio.onloadedmetadata = () => {
            totalDurationEl.innerText = formatTime(audio.duration);
            currentTimeEl.innerText = "0:00"; 
            progressBar.value = 0;
            updatePlaybackPosition();
        };

        function seekAudio() {
            if (audio.duration) {
                const seekTime = (progressBar.value / 100) * audio.duration;
                audio.currentTime = seekTime;
                updatePlaybackPosition();
            }
        }
    </script>
</body>
</html>
